
server:
  port: 8082
  servlet:
    context-path: /hotel-service

spring:
  application:
    name: HOTEL-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=hm-hotel-service
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Options: create, create-drop, update, validate, none
      # 'update' updates the schema; use 'validate' or 'none' in production
      ddl-auto: update
    show-sql: true
    # Dialect will be auto-detected
#    properties:
#      hibernate:
#        format_sql: true
#        dialect: org.hibernate.dialect.PostgreSQLDialect

  config:
    import: optional:configserver:http://localhost:8085 #8085 is the config server's port


  # Commenting out eureka server configurations as this is common for all the modules so will import it from the git
#eureka:
#  instance:
#    prefer-ip-address: true
#  client:
#    fetch-registry: true
#    register-with-eureka: true
#    service-url:
#      defaultZone: http://localhost:8761/eureka

management:
  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

logging:
  pattern:
    correlation: "[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}] "
  include-application-name: false