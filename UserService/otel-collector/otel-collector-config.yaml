receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

# THis is for zipkin
#exporters:
#  zipkin:
#    endpoint: http://zipkin:9411/api/v2/spans
#  debug:
#    verbosity: detailed

# This is for jaeger
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
#      exporters:
#        - zipkin
#        - debug
      exporters:
        - otlp/jaeger

    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug